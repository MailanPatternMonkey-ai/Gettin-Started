name: TD-COS-FH-001 supplementary verification

on:
  pull_request:
    paths:
      - 'corpus/mathematics/TD-COS-FH-001/**'
      - '.github/workflows/td-cos-fh-001-verification.yml'
  push:
    branches: [main]
    paths:
      - 'corpus/mathematics/TD-COS-FH-001/**'
      - '.github/workflows/td-cos-fh-001-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Supplementary arithmetic/certificate verification only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Finite supporting checks only; no theorem, physical, empirical, or review validation.
      # Physical Q2 = NOT_RUN; production = NOT_AUTHORIZED; historical mismatch = UNRESOLVED.
      - name: Run the four README checks with assertions enabled
        working-directory: corpus/mathematics/TD-COS-FH-001
        shell: bash
        run: |
          python3 verify.py > "$RUNNER_TEMP/td-cos-fh-001-verification.json"
          cmp verification_original.json "$RUNNER_TEMP/td-cos-fh-001-verification.json"
          python3 verify_certificates.py > "$RUNNER_TEMP/td-cos-fh-001-certificates.json"
          cmp certificates.json "$RUNNER_TEMP/td-cos-fh-001-certificates.json"
